name: Build APK

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'release = primera vez o cambios grandes (genera APK para instalar) | patch = actualizacion por el aire'
        required: true
        default: patch
        type: choice
        options:
          - release
          - patch
      permitir_cambios_nativos:
        description: 'Solo para patch: ignorar diferencias nativas. Marcar SOLO si desde el release unicamente cambio codigo Dart (lib/) y no se agregaron ni actualizaron plugins'
        required: false
        default: false
        type: boolean

env:
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # solo para guardar pubspec.lock despues de un release
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (para generar la carpeta android)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Generar android (preservando pubspec, lib y shorebird.yaml)
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -r lib /tmp/lib_backup
          cp shorebird.yaml /tmp/shorebird.yaml
          flutter create --platforms=android --project-name comandas_app --org com.puestocomida .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/shorebird.yaml shorebird.yaml

      - name: Permiso de Internet para release
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          fi

      - name: Permiso de notificaciones y minSdk para Firebase
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$MANIFEST"
          fi
          # Firebase pide minSdk 23 o mas: se usa el mayor entre el de Flutter y 23
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's#minSdk = flutter.minSdkVersion#minSdk = maxOf(flutter.minSdkVersion, 23)#' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's#minSdkVersion flutter.minSdkVersion#minSdkVersion Math.max(flutter.minSdkVersion, 23)#' android/app/build.gradle
          fi
          grep -n "minSdk" android/app/build.gradle* || true

      - name: Nombre de la app
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="comandas_app"#android:label="Comandas"#' "$MANIFEST"

      - name: Canal de aviso emergente (comandas nuevas)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          ACT=$(find android/app/src/main -name 'MainActivity.kt' | head -n1)
          if [ -z "$ACT" ]; then
            echo "::warning::No se encontro MainActivity.kt; el aviso emergente no se activa"
          else
            PKG=$(grep -m1 '^package ' "$ACT" | sed 's/^package //; s/[[:space:]]*$//')
            sed "s#__PACKAGE__#$PKG#" android_extra/MainActivity.kt.tpl > "$ACT"
            echo "MainActivity.kt reemplazado (package $PKG)"
          fi
          if ! grep -q "default_notification_channel_id" "$MANIFEST"; then
            sed -i 's#</application>#    <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="comandas_nuevas"/>\n    </application>#' "$MANIFEST"
          fi
          grep -n "comandas_nuevas" "$MANIFEST" || true

      - name: Generar icono de la app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Shorebird Release (genera APK)
        if: ${{ inputs.accion == 'release' }}
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: latest
          args: "--artifact apk -- --no-tree-shake-icons"

      - name: Publicar APK (solo en release)
        if: ${{ inputs.accion == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: comandas-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Guardar pubspec.lock (versiones exactas de librerias)
        if: ${{ inputs.accion == 'release' }}
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock ya estaba guardado y sin cambios."
          else
            git commit -m "Guardar pubspec.lock del release"
            git push
          fi

      - name: Shorebird Patch (actualizacion por el aire)
        if: ${{ inputs.accion == 'patch' }}
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: latest
          args: "${{ inputs.permitir_cambios_nativos && '--allow-native-diffs ' || '' }}-- --no-tree-shake-icons"
